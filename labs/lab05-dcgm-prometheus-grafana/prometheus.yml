global:
  scrape_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: dcgm
    static_configs:
      # Real GPU host: dcgm-exporter:9400 (docker-compose.gpu.yml)
      # No-GPU practice: host.docker.internal:9400 (fake_dcgm_exporter.py)
      - targets: ["dcgm-exporter:9400", "host.docker.internal:9400"]
