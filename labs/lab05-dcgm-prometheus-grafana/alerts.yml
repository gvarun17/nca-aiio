groups:
  - name: gpu-health
    rules:
      - alert: GPUHighTemperature
        expr: DCGM_FI_DEV_GPU_TEMP > 85
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} on {{ $labels.Hostname }} is hot ({{ $value }} C)"

      - alert: GPUThermalThrottleSuspected
        expr: DCGM_FI_DEV_GPU_TEMP > 85 and DCGM_FI_DEV_SM_CLOCK < 1600
        for: 1m
        labels: {severity: warning}
        annotations:
          summary: "GPU {{ $labels.gpu }} clocks are low while hot: thermal throttling"

      - alert: GPULowUtilization
        expr: avg_over_time(DCGM_FI_DEV_GPU_UTIL[5m]) < 20
        for: 5m
        labels: {severity: info}
        annotations:
          summary: "GPU {{ $labels.gpu }} utilization < 20% for 5m: idle or data-starved"

      - alert: GPUXidError
        expr: DCGM_FI_DEV_XID_ERRORS > 0
        labels: {severity: critical}
        annotations:
          summary: "XID {{ $value }} on GPU {{ $labels.gpu }}, {{ $labels.Hostname }}: drain node and investigate"

      - alert: GPUUncorrectableECC
        expr: DCGM_FI_DEV_ECC_DBE_VOL_TOTAL > 0
        labels: {severity: critical}
        annotations:
          summary: "Uncorrectable ECC on GPU {{ $labels.gpu }}: drain node, reset GPU, run dcgmi diag -r 3"

      - alert: GPUCorrectableECCRising
        expr: increase(DCGM_FI_DEV_ECC_SBE_VOL_TOTAL[10m]) > 5
        labels: {severity: warning}
        annotations:
          summary: "Correctable ECC errors rising on GPU {{ $labels.gpu }}"
