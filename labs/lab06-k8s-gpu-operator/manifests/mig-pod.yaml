# Needs an A100/H100 with MIG enabled through the nvidia.com/mig.config node label.
# With migStrategy "mixed", the resource name includes the profile.
apiVersion: v1
kind: Pod
metadata:
  name: mig-pod
spec:
  restartPolicy: OnFailure
  containers:
    - name: c
      image: nvcr.io/nvidia/cuda:12.5.0-base-ubuntu22.04
      command: ["nvidia-smi", "-L"]
      resources:
        limits:
          nvidia.com/mig-1g.10gb: 1
