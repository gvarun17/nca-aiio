apiVersion: v1
kind: Pod
metadata:
  name: gpu-pod-a
spec:
  containers:
    - name: c
      image: nvcr.io/nvidia/cuda:12.5.0-base-ubuntu22.04
      command: ["bash", "-c", "nvidia-smi -L; sleep 3600"]
      resources:
        limits:
          nvidia.com/gpu: 1
---
